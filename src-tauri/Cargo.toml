[package]
name = "ficsit-companion"
version = "0.1.0"
description = "Local-first desktop companion for Satisfactory: reads your saves and shows what you built, how it grew and what is missing."
authors = ["RoGiz7"]
license = "MIT"
repository = "https://github.com/RoGiz7/ficsit-companion"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ficsit_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: deja que el webview pinte imagenes de una carpeta concreta
# del disco del usuario (los iconos que el extrae de su propia copia del juego).
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"

# El actualizador solo existe en escritorio. En movil no hay target y el
# build fallaria, de ahi la condicion.
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
flate2 = "1"

