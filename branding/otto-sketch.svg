<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 100" width="140" height="100" role="img" aria-label="OttO">
  <title>OttO</title>
  <!-- BOCETO. Nada decidido ni aplicado: la app se sigue llamando FICSIT
       Companion. Esto guarda la idea para no perderla.

       OttO, con O mayuscula y t minuscula. La diferencia con OTTO no es
       cosmetica: la t minuscula es mas baja y lleva el travesano a media
       altura, asi que los ojos mandan y la nariz queda pequena en el medio.
       Con dos T mayusculas el centro pesa demasiado y se come la cara.

       Idea de Zigor, incluida la observacion de que la misma forma se lee como
       un rostro o como el frontal de un camion -- dos faros y una parrilla --
       segun quien mire. Que cada uno vea una cosa distinta no es un problema
       del logo: es que lo miran con sus propios ojos.

       Pie curvo en las dos t: es lo que hace que se lean como tipografia y no
       como dos palos clavados.

       LA REGLA, que ya fallo dos veces: tienen que seguir siendo DOS t. Un
       primer intento las fundio en una y escribia OTO. Otro las unio por abajo
       y escribia OtJO. Otro les puso doble travesano y salia O#O. En cuanto
       las letras dejan de ser letras, da igual lo bien que quede la cara.

       Dibujado a 196, 84 y 45 px antes de elegir, que es lo unico que decide
       estas cosas. currentColor para heredar el color de donde se use. -->
  <g fill="none" stroke="currentColor" stroke-width="7">
    <circle cx="24" cy="50" r="18"/><circle cx="116" cy="50" r="18"/>
  </g>
  <g fill="currentColor"><circle cx="24" cy="50" r="6.5"/><circle cx="116" cy="50" r="6.5"/></g>
  <g fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52 40h36"/>
    <path d="M62 30v26a5 5 0 0 0 5 5"/>
    <path d="M78 30v26a5 5 0 0 0 5 5"/>
  </g>
</svg>
