<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 100" width="140" height="100" role="img" aria-label="OTTO">
  <title>OTTO</title>
  <!-- BOCETO. Nada de esto esta decidido ni aplicado: la app se sigue llamando
       FICSIT Companion. Esto solo guarda la idea para no perderla.

       Las dos O son los ojos y las dos T comparten travesano para hacer de
       nariz: la palabra ES la cara. Idea de Zigor.

       La regla que casi se me escapa: tiene que seguir leyendose OTTO, con las
       DOS T. El primer intento las fundio en una sola y el logo escribia OTO,
       o sea el nombre mal puesto. Un logo que deletrea mal la marca no es un
       logo, por bonita que quede la cara.

       Patas cortas a proposito: dejan aire y a 45 px los ojos siguen mandando.
       Con las patas juntandose en punta, el centro se convierte en una mancha a
       ese tamano y se pierde la doble T. Comprobado dibujando las cuatro
       variantes a 196, 84 y 45 px, que es lo unico que decide estas cosas.

       currentColor para que herede el color de donde se use. -->
  <g fill="none" stroke="currentColor" stroke-width="7"><circle cx="24" cy="50" r="18"/><circle cx="116" cy="50" r="18"/></g>
  <g fill="currentColor"><circle cx="24" cy="50" r="6.5"/><circle cx="116" cy="50" r="6.5"/></g>
  <g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"><path d="M48 32h44"/><path d="M60 32v28"/><path d="M80 32v28"/></g>
</svg>
