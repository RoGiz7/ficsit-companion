<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- FICSIT Companion — logo propio. Hexagono industrial + curva de
       crecimiento: lo que hace la app es ensenarte tu fabrica creciendo.
       Colores del tema: --accent #ff9e3d, --accent-dim #b3701f. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1f27"/>
      <stop offset="100%" stop-color="#0c0e12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.62">
      <stop offset="0%" stop-color="#ff9e3d" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ff9e3d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="208" fill="url(#tile)"/>
  <rect width="1024" height="1024" rx="208" fill="url(#glow)"/>
  <polygon points="852,512 682,806 342,806 172,512 342,218 682,218"
           fill="none" stroke="#ff9e3d" stroke-width="48" stroke-linejoin="round"/>
  <g>
    <rect x="318" y="530" width="100" height="170" rx="20" fill="#b3701f"/>
    <rect x="462" y="430" width="100" height="270" rx="20" fill="#e8772e"/>
    <rect x="606" y="330" width="100" height="370" rx="20" fill="#ff9e3d"/>
  </g>
</svg>
