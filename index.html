<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Satisfactory Companion</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <header>
        <div class="brand">
          <span class="brand-dot"></span>
          <div>
            <h1>Satisfactory <span>Companion</span></h1>
            <span class="brand-sub">FICSIT · Asistente de Pionero</span>
          </div>
        </div>
        <span class="phase">Fase 17 · niveles construidos</span>
      </header>

      <section class="folder-bar">
        <label for="folder">Carpeta de partidas</label>
        <div class="folder-row">
          <input id="folder" spellcheck="false" />
          <button id="refresh" type="button">Vigilar</button>
        </div>
      </section>

      <section class="world-bar">
        <label for="world-select">Mundo</label>
        <select id="world-select"></select>
      </section>

      <p id="status" class="status">Cargando…</p>

      <nav class="tabs">
        <button class="tab active" data-tab="resumen" type="button">Resumen</button>
        <button class="tab" data-tab="produccion" type="button">Producción</button>
        <button class="tab" data-tab="mapa" type="button">Mapa</button>
        <button class="tab" data-tab="plan" type="button">Plan y notas</button>
        <button class="tab" data-tab="guardados" type="button">Guardados</button>
      </nav>

      <!-- RESUMEN: estado del mundo abierto -->
      <section class="tab-panel" id="tab-resumen">
        <h2 id="detail-title">—</h2>
        <p id="detail-status" class="detail-status"></p>
        <div id="resume" class="resume"></div>
        <div id="detail-grid" class="detail-grid"></div>
        <div id="vitals" class="progress"></div>
        <div id="progress" class="progress"></div>
        <div id="exploration" class="progress"></div>
        <div id="history" class="history"></div>
        <div id="inventory" class="inventory"></div>
        <div id="stored" class="inventory"></div>
      </section>

      <!-- PRODUCCIÓN: calculadora de cadenas -->
      <section class="tab-panel hidden" id="tab-produccion">
        <div id="production" class="production"></div>
        <div id="balance" class="balance"></div>
        <div id="calc" class="calc"></div>
      </section>

      <!-- MAPA: plano 2D de la fábrica -->
      <section class="tab-panel hidden" id="tab-mapa">
        <div id="map" class="map"></div>
      </section>

      <!-- PLAN Y NOTAS -->
      <section class="tab-panel hidden" id="tab-plan">
        <div id="plan" class="plan"></div>
        <div class="notes">
          <label for="note-text" id="note-label">Notas de esta partida</label>
          <textarea
            id="note-text"
            rows="6"
            placeholder="¿Dónde lo dejaste? ¿Qué ibas a montar? Ej: 'Falta conectar la línea de placas de circuito al norte; pendiente subir energía.'"
          ></textarea>
          <div class="notes-bar">
            <button id="note-save" type="button">Guardar nota</button>
            <span id="note-status" class="note-status"></span>
          </div>
        </div>
      </section>

      <!-- GUARDADOS: lista de saves del mundo + importar histórico -->
      <section class="tab-panel hidden" id="tab-guardados">
        <table class="saves">
          <thead>
            <tr>
              <th>Partida</th>
              <th>Tiempo jugado</th>
              <th>Guardada</th>
              <th class="num">Tamaño</th>
            </tr>
          </thead>
          <tbody id="saves-body"></tbody>
        </table>
        <div class="import-bar">
          <button id="import-history" type="button">Importar mis partidas al histórico</button>
          <span id="import-status" class="muted"></span>
        </div>
      </section>
    </main>
  </body>
</html>
